name: Sürüm yayınla

# package.json'daki sürümle (ör. 1.0.1) Windows kurulumunu derler ve
# GitHub Releases'a "v1.0.1" olarak yükler. Kurulu uygulamalar buradan güncellenir.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json']

permissions:
  contents: write

# Arka arkaya iki birleştirme olursa yayınlar sırayla çalışsın: ikisi aynı sürümü aynı anda
# silip yeniden yüklemesin (sonraki, sürüm zaten yayınlandıysa atlar)
concurrency:
  group: surum-yayinla
  cancel-in-progress: false

jobs:
  # Önce otomatik sınama: uygulama açılmıyorsa ya da bir ekran çöküyorsa sürüm yayınlanmaz
  sinama:
    uses: ./.github/workflows/sinama.yml

  windows:
    needs: sinama
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sürümü oku
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Bu sürüm zaten yayınlandı mı?
        id: exists
        shell: bash
        run: |
          if gh release view "v${{ steps.ver.outputs.v }}" --json assets -q '.assets[].name' 2>/dev/null | grep -q '^latest.yml$'; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "v${{ steps.ver.outputs.v }} zaten yayınlanmış, atlanıyor."
          fi
      - if: steps.exists.outputs.skip != '1'
        run: npm ci
      - if: steps.exists.outputs.skip != '1'
        name: Derle
        run: npm run dist:win
      - if: steps.exists.outputs.skip != '1'
        name: GitHub Releases'a yükle
        shell: bash
        run: |
          V="v${{ steps.ver.outputs.v }}"
          gh release delete "$V" --yes --cleanup-tag 2>/dev/null || true
          NOTES="release-notes/${{ steps.ver.outputs.v }}.md"
          [ -f "$NOTES" ] || { echo "Naphian $V" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$V" --target "$GITHUB_SHA" --title "Naphian $V" --notes-file "$NOTES" \
            release/Kovan-Setup-*.exe release/Kovan-Setup-*.exe.blockmap release/latest.yml
      - if: steps.exists.outputs.skip != '1'
        name: Güncelleme düğmesi bu sürümü görüyor mu
        shell: bash
        run: node test/surum/yayin-dogrula.mjs "${{ steps.ver.outputs.v }}"

  # v1.68 telefon uygulaması: Windows sürümü yayınlandıktan sonra APK aynı sürüme eklenir, iPhone sürümü TestFlight'a gider
  mobil:
    needs: windows
    uses: ./.github/workflows/mobil.yml
    with:
      yayinla: true
    secrets: inherit
